android.enableJetifier=true
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx8g

# Versioning
# VERSION_NAME / VERSION_CODE track upstream (FossifyOrg/Notes).
# BUILD_NUMBER is our fork increment, bumped on every build with changes.
# Fork versionName = "<VERSION_NAME>+<BUILD_NUMBER>", versionCode = VERSION_CODE * 10000 + BUILD_NUMBER.
VERSION_NAME=1.7.0
VERSION_CODE=13
BUILD_NUMBER=6
# Installed package id for our fork (kept distinct so it coexists with upstream).
APP_ID=shiroikuma.memo
# Code namespace stays on the upstream package so R/BuildConfig and sources are unchanged.
APP_NAMESPACE=org.fossify.notes
